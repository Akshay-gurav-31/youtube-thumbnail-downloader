<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Thumbnail Downloader</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #000000;
            color: #ffffff;
        }

        /* Glass Input styling */
        .glass-input-wrapper {
            background: rgba(18, 18, 20, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(16px);
            transition: border-color 0.25s ease, box-shadow 0.25s ease;
        }
        .glass-input-wrapper:focus-within {
            border-color: rgba(245, 166, 200, 0.6);
            box-shadow: 0 0 25px rgba(245, 166, 200, 0.15);
        }

        /* Pink button styling */
        .btn-pink {
            background-color: #F5A6C8;
            color: #000000;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-pink:hover {
            background-color: #f7b7d2;
            transform: scale(1.01);
        }
        .btn-pink:active {
            transform: scale(0.98);
        }

        /* Smooth fade animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
<body class="bg-black min-h-screen flex flex-col justify-between selection:bg-[#F5A6C8] selection:text-black">

    <!-- Main Hero Section -->
    <main class="w-full max-w-5xl mx-auto px-4 py-8 sm:py-16 flex flex-col items-center text-center my-auto">
        
        <!-- Heading Block -->
        <div class="space-y-1 sm:space-y-2 mb-10 sm:mb-14">
            <!-- Row 1: YouTube Logo + Thumbnail -->
            <div class="flex items-center justify-center flex-wrap gap-3 sm:gap-4 leading-none">
                <!-- YouTube Wordmark (You in white, Tube inside Red rounded rectangle) -->
                <div class="inline-flex items-center">
                    <span class="text-4xl sm:text-6xl md:text-7xl lg:text-[84px] font-black tracking-tight text-white mr-1.5 sm:mr-2.5">You</span>
                    <span class="bg-[#FF0000] text-white text-3xl sm:text-5xl md:text-6xl lg:text-[74px] font-black tracking-tight px-3 sm:px-4 py-0.5 sm:py-1 rounded-xl sm:rounded-2xl inline-flex items-center shadow-md">Tube</span>
                </div>
                <!-- Thumbnail -->
                <h1 class="text-4xl sm:text-6xl md:text-7xl lg:text-[84px] font-black tracking-tight text-white">
                    Thumbnail
                </h1>
            </div>

            <!-- Row 2: Downloader (Pink) -->
            <h2 class="text-4xl sm:text-6xl md:text-7xl lg:text-[84px] font-black tracking-tight text-[#F5A6C8] leading-none">
                Downloader
            </h2>
        </div>

        <!-- Input Bar -->
        <div class="w-full max-w-3xl">
            <form id="urlForm" class="relative w-full">
                <div class="glass-input-wrapper relative flex items-center rounded-full p-1.5 sm:p-2 pl-5 sm:pl-6">
                    <!-- Chain Link Icon -->
                    <div class="text-white mr-3 flex-shrink-0">
                        <svg class="w-5 h-5 sm:w-6 sm:h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path>
                        </svg>
                    </div>

                    <!-- Input Field -->
                    <input 
                        type="text" 
                        id="youtubeUrl" 
                        placeholder="Paste your YouTube video URL here..." 
                        class="w-full bg-transparent text-white placeholder-zinc-400 font-medium text-sm sm:text-base focus:outline-none pr-3"
                        autocomplete="off"
                        required
                    />

                    <!-- Download Button -->
                    <button 
                        type="submit" 
                        class="btn-pink font-extrabold text-sm sm:text-base px-7 sm:px-9 py-3 sm:py-3.5 rounded-full flex-shrink-0 cursor-pointer"
                    >
                        Download
                    </button>
                </div>
            </form>
        </div>

        <!-- Notification / Error Box -->
        <div id="errorMsg" class="hidden mt-6 px-4 py-3 rounded-lg bg-red-950/60 border border-red-500/30 text-red-300 text-sm animate-fade-in max-w-lg w-full">
            Please enter a valid YouTube URL (e.g. https://www.youtube.com/watch?v=dQw4w9WgXcQ)
        </div>

        <!-- Thumbnail Results Container -->
        <div id="resultsContainer" class="hidden mt-12 w-full max-w-4xl animate-fade-in text-left">
            <h3 class="text-lg font-bold text-white mb-4">Available Thumbnails</h3>
            <div id="thumbnailGrid" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Dynamically populated thumbnails -->
            </div>
        </div>

    </main>

    <!-- Simple Footer -->
    <footer class="w-full py-6 text-center text-xs text-zinc-500">
        YouTube Thumbnail Downloader &copy; 2026. All rights reserved.
    </footer>

    <!-- Client Script for Parsing YouTube ID & Displaying Thumbnails -->
    <script>
        const form = document.getElementById('urlForm');
        const input = document.getElementById('youtubeUrl');
        const errorMsg = document.getElementById('errorMsg');
        const resultsContainer = document.getElementById('resultsContainer');
        const thumbnailGrid = document.getElementById('thumbnailGrid');

        function extractVideoId(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const videoUrl = input.value.trim();
            const videoId = extractVideoId(videoUrl);

            if (!videoId) {
                errorMsg.classList.remove('hidden');
                resultsContainer.classList.add('hidden');
                return;
            }

            errorMsg.classList.add('hidden');

            // Define thumbnail qualities
            const qualities = [
                { name: 'Max Resolution', res: 'maxresdefault', desc: '1280 x 720 (Best Quality)' },
                { name: 'High Quality', res: 'hqdefault', desc: '480 x 360 (Standard)' },
                { name: 'Medium Quality', res: 'mqdefault', desc: '320 x 180 (Medium)' },
                { name: 'Standard Definition', res: 'sddefault', desc: '640 x 480 (SD)' }
            ];

            thumbnailGrid.innerHTML = '';

            qualities.forEach(q => {
                const imgUrl = `https://img.youtube.com/vi/${videoId}/${q.res}.jpg`;
                
                const card = document.createElement('div');
                card.className = 'bg-zinc-900 border border-zinc-800 rounded-2xl p-4 flex flex-col justify-between transition hover:border-zinc-700';
                
                card.innerHTML = `
                    <div>
                        <div class="relative rounded-xl overflow-hidden mb-3 bg-zinc-950 aspect-video flex items-center justify-center">
                            <img src="${imgUrl}" alt="${q.name}" class="object-cover w-full h-full" onerror="this.parentElement.parentElement.parentElement.style.display='none'">
                        </div>
                        <div class="flex justify-between items-center mb-1">
                            <h4 class="font-bold text-white text-sm sm:text-base">${q.name}</h4>
                            <span class="text-xs text-zinc-400 bg-zinc-800 px-2 py-0.5 rounded">${q.desc.split(' ')[0]}</span>
                        </div>
                        <p class="text-xs text-zinc-400 mb-4">${q.desc}</p>
                    </div>
                    <a href="${imgUrl}" target="_blank" download="youtube-thumbnail-${q.res}.jpg" class="w-full py-2.5 px-4 bg-white text-black font-semibold text-center rounded-xl hover:bg-zinc-200 transition text-sm">
                        Download Image
                    </a>
                `;
                thumbnailGrid.appendChild(card);
            });

            resultsContainer.classList.remove('hidden');
            resultsContainer.scrollIntoView({ behavior: 'smooth' });
        });
    </script>
</body>
</html>
